server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 古いファイルと新しいファイルが混ざらないよう、毎回サーバーに確認させる
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(js|css|json)$ { add_header Cache-Control "no-cache"; }
}
