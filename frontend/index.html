<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ec">
  <meta name="description" content="定期券で行ける途中駅を、サイコロとビンゴで冒険しよう。">
  <title>定期券すごろく</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- ===== 最初の画面：定期券の区間えらび ===== -->
    <section id="screen-route" class="screen" hidden></section>

    <!-- ===== Step 1: 路線すごろく ===== -->
    <section id="screen-board" class="screen">
      <header class="app-head">
        <h1 class="logo">定期券すごろく</h1>
        <div class="head-tools">
          <button type="button" class="counter" id="counter" aria-label="スタンプ帳を開く"></button>
          <button type="button" class="icon-btn" id="btn-mute" aria-label="効果音"></button>
          <button type="button" class="icon-btn" id="btn-menu" aria-label="メニュー">⋯</button>
        </div>
      </header>

      <div id="resume-banner" hidden></div>

      <section class="setup" aria-label="今日の条件">
        <div class="field">
          <span class="field-label">進む方向</span>
          <div class="seg" id="seg-dir" role="group" aria-label="進む方向"></div>
        </div>
      </section>

      <section class="board-wrap" aria-label="スタンプラリー路線図">
        <ol id="route-legend" class="route-legend" aria-label="路線と乗り換え"></ol>
        <div id="board" class="board"></div>
        <div class="legend" aria-hidden="true">
          <span><i class="lg"></i>まだ空っぽ</span>
          <span><i class="lg lg-start"></i>乗車駅</span>
          <span><i class="lg lg-progress"></i>ビンゴ挑戦中</span>
          <span><i class="lg lg-explored"></i>スタンプGET</span>
          <span><i class="lg lg-perfect"></i>全マス制覇</span>
        </div>
      </section>

      <div class="dock">
        <div id="dice-host" class="dice-host"></div>
        <div class="dock-main">
          <div id="dock-msg" class="dock-msg" aria-live="polite">コマのいる駅から、出た目の数だけ進むよ</div>
          <button type="button" id="btn-roll" class="btn-primary big">🎲 サイコロを振る</button>
          <div id="dock-result" class="dock-result" hidden></div>
        </div>
      </div>
    </section>

    <!-- ===== Step 2/3: ビンゴ ===== -->
    <section id="screen-bingo" class="screen" hidden></section>

    <!-- ===== スタンプ帳 ===== -->
    <section id="screen-stamps" class="screen" hidden></section>
  </div>

  <!-- ミッション生成中 -->
  <div id="loading" class="loading" hidden role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-rail" aria-hidden="true">
        <div class="loading-train">🚃</div>
      </div>
      <div class="loading-station"></div>
      <div class="loading-msg"></div>
    </div>
  </div>

  <!-- ミッション詳細シート -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <button type="button" class="sheet-close" data-close aria-label="閉じる">×</button>
      <div class="sheet-body"></div>
    </div>
  </div>

  <!-- メニュー -->
  <div id="menu-sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="メニュー" tabindex="-1">
      <button type="button" class="sheet-close" data-close aria-label="閉じる">×</button>
      <div class="sheet-body">
        <h2 class="sheet-title">メニュー</h2>
        <p class="small muted" id="mode-info"></p>
        <p class="small muted">進行状況はこの端末のブラウザ（localStorage）にだけ保存されます。</p>
        <button type="button" class="btn-primary" id="btn-pass-edit">定期区間を変更する</button>
        <button type="button" class="btn-secondary" id="btn-piece-home">🚃 コマを乗車駅に戻す</button>
        <button type="button" class="btn-danger" id="btn-reset">進行状況をリセット</button>
      </div>
    </div>
  </div>

  <input type="file" id="photo-input" accept="image/*" hidden>

  <script type="module" src="js/main.js"></script>
</body>
</html>
